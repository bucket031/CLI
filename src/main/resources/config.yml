# CustomLockItem config.
# You can edit these in-game with /customlockitems config (sliders),
# or here and then run /customlockitems reload.
lucky_coin:
  duration_seconds: 5      # 1 - 60
  cooldown_seconds: 600    # 0 - 3600 (600 = 10 minutes)
  resistance_level: 5      # 1 - 5 (5 = Resistance V)
timestop_clock:
  duration_seconds: 15     # 1 - 120
  cooldown_seconds: 90     # 0 - 3600 (90 = 1 minute 30 seconds)
  tick_rate: 10            # 1 - 20 (20 = normal speed, 10 = half speed)
  radius: 7                # blocks, 1 - 32 (file only)
  resistance_level: 1      # 1 - 5 (file only) given to the user while active
exponential_eye:
  radius: 20               # blocks, 5 - 64
  armor_damage: 150        # durability removed from every worn armor piece, 0 - 1000
# Secret upgraded Timestop Clock. Give it with /customlockitems give abyssal_clock
# Edit in-game with /customlockitems config abyssal
abyssal_clock:
  duration_seconds: 20     # 1 - 120
  cooldown_seconds: 120    # 0 - 3600
  tick_rate: 5             # 1 - 20 (20 = normal speed, 5 = quarter speed)
  attack_speed_percent: 100  # 0 - 300 (100 = double attack speed)
  radius: 10               # blocks, 1 - 32 (file only)
  resistance_level: 1      # 0 - 5 (file only) given to the user while active, 0 = none
